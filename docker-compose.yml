version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: hera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hera_password}
      POSTGRES_DB: ${POSTGRES_DB:-hera_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hera} -d ${POSTGRES_DB:-hera_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend FastAPI
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hera-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hera}:${POSTGRES_PASSWORD:-hera_password}@db:5432/${POSTGRES_DB:-hera_db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # En développement, monter le code source pour le hot-reload
      - ./backend/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # pgAdmin (optionnel, pour l'administration de la BDD)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hera-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hera.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    profiles:
      - tools

volumes:
  postgres_data:

networks:
  default:
    name: hera-network
